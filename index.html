<!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" /> <title>Hit the Iron - 2분할 운동일지</title> <style> :root { --bg: #0f172a; --surface: #1e293b; --surface-2: #334155; --border: #334155; --text: #f8fafc; --text-muted: #94a3b8; --primary: #38bdf8; --primary-dark: #0284c7; --accent: #22c55e; --danger: #ef4444; --warning: #f59e0b; --radius: 14px; } * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; } body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.45; padding-bottom: 84px; user-select: none; } header { position: sticky; top: 0; z-index: 20; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; } header h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; display: flex; align-items: center; gap: 6px; } .badge-v1 { font-size: 11px; background: rgba(56, 189, 248, 0.18); color: var(--primary); padding: 2px 7px; border-radius: 999px; font-weight: 700; } .container { max-width: 540px; margin: 0 auto; padding: 16px; } .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; } .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; } /* Program & Routine Selector */ select, input[type="text"], input[type="date"], textarea { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px; width: 100%; outline: none; font-family: inherit; } select:focus, input:focus, textarea:focus { border-color: var(--primary); } .routine-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; } .routine-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px 10px; text-align: left; cursor: pointer; transition: all 0.15s; } .routine-btn.active { border-color: var(--primary); background: rgba(56, 189, 248, 0.12); } .routine-btn .r-day { font-size: 11px; color: var(--primary); font-weight: 700; margin-bottom: 2px; } .routine-btn .r-name { font-size: 14px; font-weight: 700; } .routine-btn .r-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; } .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; } .btn { border: none; border-radius: 10px; padding: 11px 14px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; } .btn-primary { background: var(--primary); color: #0f172a; } .btn-secondary { background: var(--surface-2); color: var(--text); } .btn-success { background: var(--accent); color: #052e16; } .btn-danger-outline { background: transparent; border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 6px 10px; font-size: 12px; } .btn-sm { padding: 7px 10px; font-size: 12px; border-radius: 8px; } /* Exercise Card */ .ex-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; } .ex-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; } .ex-title-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .ex-title { font-size: 16px; font-weight: 800; color: var(--text); } .muscle-select { width: auto; padding: 3px 8px; font-size: 11px; font-weight: 700; border-radius: 999px; background: rgba(56, 189, 248, 0.14); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.35); cursor: pointer; } /* Memo Box */ .memo-area { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(51, 65, 85, 0.7); } .prev-memo-hint { font-size: 11px; color: var(--warning); background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.25); border-radius: 8px; padding: 6px 9px; margin-bottom: 6px; line-height: 1.4; user-select: text; } .memo-input { font-size: 12px; padding: 8px 10px; border-radius: 8px; background: rgba(15, 23, 42, 0.7); color: var(--text); border: 1px solid var(--border); resize: vertical; min-height: 36px; user-select: text; } .memo-input::placeholder { color: #64748b; } /* Set Row */ .set-block { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; } .set-block.done { border-color: rgba(34, 197, 94, 0.5); background: rgba(34, 197, 94, 0.06); } .prev-hint { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; display: flex; justify-content: space-between; } .set-controls { display: flex; align-items: center; justify-content: space-between; gap: 6px; } .set-num { font-size: 12px; font-weight: 800; color: var(--text-muted); width: 26px; text-align: center; flex-shrink: 0; } .stepper { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex: 1; } .step-btn { background: transparent; border: none; color: var(--text); font-size: 16px; font-weight: 700; width: 30px; height: 34px; cursor: pointer; flex-shrink: 0; } .step-btn:active { background: var(--surface-2); } .num-input { width: 100%; min-width: 38px; background: transparent; border: none; color: var(--text); text-align: center; font-size: 14px; font-weight: 800; padding: 4px 0; outline: none; -moz-appearance: textfield; user-select: text; } .num-input::-webkit-outer-spin-button, .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; } .unit-label { font-size: 11px; color: var(--text-muted); padding-right: 4px; flex-shrink: 0; } .check-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-size: 16px; font-weight: 800; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; } .check-btn.checked { background: var(--accent); border-color: var(--accent); color: #052e16; } .ex-footer { display: flex; gap: 8px; margin-top: 8px; } /* Bottom Navigation */ nav.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0 12px; z-index: 30; } .nav-item { background: transparent; border: none; color: var(--text-muted); font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 4px 10px; flex: 1; } .nav-item.active { color: var(--primary); } .nav-icon { font-size: 18px; } .view { display: none; } .view.active { display: block; } /* History */ .history-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; user-select: text; } .history-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; } .history-memo { font-size: 11px; color: var(--warning); margin-left: 6px; display: block; margin-top: 2px; } .tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--text); font-weight: 700; } .muscle-mini-tag { font-size: 10px; padding: 1px 6px; border-radius: 5px; background: rgba(56, 189, 248, 0.14); color: var(--primary); font-weight: 700; margin-right: 4px; } /* Weekly Volume Stats */ .stat-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; } .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; } .stat-label { font-size: 11px; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; } .stat-value { font-size: 18px; font-weight: 800; color: var(--text); } .stat-sub { font-size: 11px; margin-top: 3px; font-weight: 700; } .diff-up { color: var(--accent); } .diff-down { color: #fca5a5; } .diff-neutral { color: var(--text-muted); } .week-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 12px; } .week-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; } .week-title { font-size: 15px; font-weight: 800; color: var(--text); } .week-range { font-size: 11px; color: var(--text-muted); margin-top: 2px; } .week-sets-big { font-size: 17px; font-weight: 800; color: var(--primary); text-align: right; } .muscle-row { margin-bottom: 9px; } .muscle-row:last-child { margin-bottom: 0; } .muscle-row-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-bottom: 4px; } .muscle-name { font-weight: 700; color: var(--text); } .muscle-sets-text { font-weight: 800; color: var(--primary); } .muscle-kg-sub { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-left: 4px; } .bar-track { width: 100%; height: 7px; background: var(--bg); border-radius: 999px; overflow: hidden; } .bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary-dark), var(--primary)); border-radius: 999px; transition: width 0.25s ease; } /* Toast */ #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #f8fafc; color: #0f172a; padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 800; box-shadow: 0 10px 25px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 50; white-space: nowrap; } #toast.show { opacity: 1; } /* Modal */ .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 40; } .modal-backdrop.open { display: flex; } .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; width: 100%; max-width: 400px; } .modal h3 { font-size: 16px; margin-bottom: 12px; } .form-group { margin-bottom: 10px; } .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; } </style> </head> <body> <header> <h1>Hit the Iron <span class="badge-v1">v1.5</span></h1> <div id="headerDate" style="font-size:12px; color:var(--text-muted); font-weight:700;"></div> </header> <div class="container"> <!-- VIEW 1: WORKOUT LOGGING --> <div id="view-workout" class="view active"> <div class="card"> <div class="section-title"> <span>분할 프로그램 선택</span> <button class="btn btn-secondary btn-sm" onclick="openNewProgramModal()">+ 새 분할 추가</button> </div> <select id="programSelect" onchange="onProgramChange()"></select> <div class="section-title" style="margin-top:14px;"> <span>오늘의 루틴 선택</span> <input type="date" id="workoutDate" style="width:auto; padding:4px 8px; font-size:12px;" /> </div> <div id="routineGrid" class="routine-grid"></div> <div class="action-row"> <button class="btn btn-primary" onclick="loadWorkout(true)">직전 기록 불러오기</button> <button class="btn btn-secondary" onclick="loadWorkout(false)">기본 루틴으로 시작</button> </div> </div> <div id="activeWorkoutHeader" style="display:none; margin-bottom:10px; justify-content:space-between; align-items:center;"> <div> <span id="currentRoutineTitle" style="font-size:17px; font-weight:800;"></span> <span id="loadModeBadge" class="tag" style="margin-left:6px;"></span> </div> <button class="btn btn-secondary btn-sm" onclick="openAddExerciseModal()">+ 종목 추가</button> </div> <div id="exerciseList"></div> <div id="workoutBottomActions" style="display:none; flex-direction:column; gap:8px; margin-top:14px;"> <button class="btn btn-success" style="padding:14px; font-size:15px;" onclick="saveWorkoutLog()">오늘 운동 일지 저장하기</button> <button class="btn btn-secondary" onclick="updateTemplateFromCurrent()">현재 종목/세트/부위 구성으로 기본 루틴 덮어쓰기</button> </div> </div> <!-- VIEW 2: WEEKLY VOLUME STATS (SETS BY MUSCLE GROUP) --> <div id="view-weekly" class="view"> <div class="section-title"> <span>주간 부위별 유효 세트 (월~일 기준)</span> <span id="weeklyCount" class="tag">0주</span> </div> <div id="weeklySummary" class="stat-summary-grid"></div> <div id="weeklyList"></div> </div> <!-- VIEW 3: HISTORY --> <div id="view-history" class="view"> <div class="section-title"> <span>저장된 운동 기록</span> <span id="historyCount" class="tag">0건</span> </div> <div id="historyList"></div> </div> <!-- VIEW 4: SETTINGS / BACKUP --> <div id="view-settings" class="view"> <div class="card"> <div class="section-title"><span>데이터 백업 및 복원 (필수)</span></div> <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;"> 브라우저 캐시 삭제나 기기 변경 시 기록이 사라지지 않도록 주기적으로 백업 파일을 저장해 두세요. </p> <div style="display:flex; flex-direction:column; gap:8px;"> <button class="btn btn-primary" onclick="exportBackup()">백업 파일(.json) 다운로드</button> <label class="btn btn-secondary" style="cursor:pointer;"> 백업 파일 불러오기 <input type="file" accept=".json" onchange="importBackup(event)" style="display:none;" /> </label> </div> </div> <div class="card"> <div class="section-title"><span>초기화</span></div> <button class="btn btn-danger-outline" style="width:100%; padding:10px;" onclick="resetToDefault()">기본 2분할 루틴으로 초기화</button> </div> </div> </div> <!-- BOTTOM NAV --> <nav class="bottom-nav"> <button class="nav-item active" onclick="switchView('workout', this)"> <span class="nav-icon">🏋️</span> <span>운동 기록</span> </button> <button class="nav-item" onclick="switchView('weekly', this)"> <span class="nav-icon">📊</span> <span>주간 볼륨</span> </button> <button class="nav-item" onclick="switchView('history', this)"> <span class="nav-icon">📅</span> <span>지난 일지</span> </button> <button class="nav-item" onclick="switchView('settings', this)"> <span class="nav-icon">⚙️</span> <span>백업/설정</span> </button> </nav> <!-- ADD EXERCISE MODAL --> <div id="addExModal" class="modal-backdrop"> <div class="modal"> <h3>오늘 운동에 종목 추가</h3> <div class="form-group"> <label>주동근 부위</label> <select id="newExMuscle"></select> </div> <div class="form-group"> <label>운동 종목명</label> <input type="text" id="newExName" placeholder="예: 케이블 크로스오버" /> </div> <div class="form-group"> <label>초기 세트 수</label> <input type="number" id="newExSets" value="3" min="1" max="10" style="background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px; width:100%;" /> </div> <div style="display:flex; gap:8px; margin-top:14px;"> <button class="btn btn-secondary" style="flex:1;" onclick="closeModal('addExModal')">취소</button> <button class="btn btn-primary" style="flex:1;" onclick="confirmAddExercise()">추가</button> </div> </div> </div> <!-- NEW PROGRAM MODAL --> <div id="newProgModal" class="modal-backdrop"> <div class="modal"> <h3>새 분할 프로그램 만들기</h3> <div class="form-group"> <label>프로그램 이름</label> <input type="text" id="newProgName" placeholder="예: 3분할 (밀기/당기기/하체)" /> </div> <div class="form-group"> <label>루틴 이름 목록 (쉼표로 구분)</label> <input type="text" id="newProgRoutines" placeholder="예: 밀기 A, 당기기 A, 하체 A" /> </div> <div style="display:flex; gap:8px; margin-top:14px;"> <button class="btn btn-secondary" style="flex:1;" onclick="closeModal('newProgModal')">취소</button> <button class="btn btn-primary" style="flex:1;" onclick="confirmNewProgram()">생성</button> </div> </div> </div> <div id="toast"></div> <script> const STORAGE_KEY = 'hit_the_iron_v1_data'; const LEGACY_STORAGE_KEY = 'prolog_v1_data'; const MUSCLE_GROUPS = [ '가슴', '등', '어깨', '이두', '삼두', '전면/측면 하체', '후면사슬' ]; const DEFAULT_MUSCLE_MAP = { '덤벨 풀오버': '가슴', '스미스 벤치프레스': '가슴', '인클라인 덤벨프레스': '가슴', '케이블 플라이': '가슴', '어시스티드 딥스': '삼두', '덤벨 오버헤드 익스텐션': '삼두', '케이블 푸시다운': '삼두', '어시스티드 풀업': '등', '랫풀다운': '등', '인클라인 덤벨로우': '등', '케이블 시티드로우': '등', '바벨컬': '이두', '해머컬': '이두', '덤벨컬': '이두', '카프레이즈': '후면사슬', '덤벨 런지': '전면/측면 하체', '스미스 스쿼트': '전면/측면 하체', '레그프레스': '전면/측면 하체', '레그익스텐션': '전면/측면 하체', '레그컬': '후면사슬', '힙 어브덕션': '후면사슬', '스미스 힙쓰러스터': '후면사슬', '스미스 데드리프트': '후면사슬', '사이드 레터럴레이즈': '어깨', '숄더프레스': '어깨', '벤트오버 레터럴레이즈': '어깨' }; function inferMuscle(name) { if (DEFAULT_MUSCLE_MAP[name]) return DEFAULT_MUSCLE_MAP[name]; if (/벤치|플라이|푸시|체스트|가슴|딥스/.test(name)) return '가슴'; if (/로우|풀다운|풀업|랫|등/.test(name)) return '등'; if (/레터럴|숄더|프레스|오버헤드|어깨|후면/.test(name)) return '어깨'; if (/컬|이두/.test(name)) return '이두'; if (/익스텐션|푸시다운|트라이|삼두/.test(name)) return '삼두'; if (/데드리프트|레그컬|힙쓰러스터|어브덕션|카프|햄스트링|둔근/.test(name)) return '후면사슬'; if (/스쿼트|레그프레스|익스텐션|런지|하체|대퇴/.test(name)) return '전면/측면 하체'; return '어깨'; } const DEFAULT_DATA = { activeProgramId: 'prog_2split', programs: [ { id: 'prog_2split', name: '강력해진 2분할 루틴 (주 4일)', routines: [ { id: 'r_upper_a', day: '월요일', name: '상체 A', desc: '가슴 고중량 / 등 고반복', exercises: [ { name: '덤벨 풀오버', muscle: '가슴', sets: 3 }, { name: '스미스 벤치프레스', muscle: '가슴', sets: 3 }, { name: '어시스티드 딥스', muscle: '삼두', sets: 2 }, { name: '덤벨 오버헤드 익스텐션', muscle: '삼두', sets: 3 }, { name: '랫풀다운', muscle: '등', sets: 4 }, { name: '케이블 시티드로우', muscle: '등', sets: 3 }, { name: '바벨컬', muscle: '이두', sets: 3 }, { name: '해머컬', muscle: '이두', sets: 3 } ] }, { id: 'r_lower_a', day: '화요일', name: '하체 A', desc: '대퇴사두 중심 + 어깨', exercises: [ { name: '카프레이즈', muscle: '후면사슬', sets: 2 }, { name: '덤벨 런지', muscle: '전면/측면 하체', sets: 3 }, { name: '스미스 스쿼트', muscle: '전면/측면 하체', sets: 3 }, { name: '레그프레스', muscle: '전면/측면 하체', sets: 2 }, { name: '레그익스텐션', muscle: '전면/측면 하체', sets: 3 }, { name: '레그컬', muscle: '후면사슬', sets: 2 }, { name: '힙 어브덕션', muscle: '후면사슬', sets: 2 }, { name: '사이드 레터럴레이즈', muscle: '어깨', sets: 4 }, { name: '숄더프레스', muscle: '어깨', sets: 3 }, { name: '벤트오버 레터럴레이즈', muscle: '어깨', sets: 3 } ] }, { id: 'r_upper_b', day: '목요일', name: '상체 B', desc: '등 고중량 / 가슴 고반복', exercises: [ { name: '어시스티드 풀업', muscle: '등', sets: 2 }, { name: '랫풀다운', muscle: '등', sets: 3 }, { name: '인클라인 덤벨로우', muscle: '등', sets: 3 }, { name alue) || 3); if (!name) return; const sets = Array.from({ length: count }, () => ({ weight: 0, reps: 10, prevWeight: null, prevReps: null, done: false })); currentSession.exercises.push({ name, muscle, memo: '', prevMemo: '', sets }); closeModal('addExModal'); renderSession(); showToast(`${name} (${muscle}) 추가 완료`); } function updateTemplateFromCurrent() { if (!currentSession) return; const prog = getActiveProgram(); const routine = prog.routines.find(r => r.id === currentSession.routineId); if (!routine) return; routine.exercises = currentSession.exercises.map(ex => ({ name: ex.name, muscle: ex.muscle || inferMuscle(ex.name), sets: ex.sets.length })); saveStorage(); showToast('기본 루틴 구성이 업데이트되었습니다'); } function saveWorkoutLog() { if (!currentSession) return; const dateStr = document.getElementById('workoutDate').value || getLocalDateStr(); const newLog = { id: 'log_' + Date.now(), date: dateStr, programName: currentSession.programName, routineId: currentSession.routineId, routineName: currentSession.routineName, exercises: JSON.parse(JSON.stringify(currentSession.exercises)) }; appData.logs.push(newLog); saveStorage(); showToast(`${dateStr} 운동 일지가 저장되었습니다!`); } /* WEEKLY EFFECTIVE SETS BY MUSCLE GROUP (MON ~ SUN) */ function getWeekInfo(dateStr) { const parts = dateStr.split('-').map(Number); const d = new Date(parts[0], parts[1] - 1, parts[2]); const dayOfWeek = d.getDay(); const diffToMon = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek); const monday = new Date(d); monday.setDate(d.getDate() + diffToMon); const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); const monStr = getLocalDateStr(monday); const thursday = new Date(monday); thursday.setDate(monday.getDate() + 3); const month = thursday.getMonth() + 1; const year = thursday.getFullYear(); const firstDayOfMonth = new Date(year, thursday.getMonth(), 1); const firstThursdayOffset = (11 - firstDayOfMonth.getDay()) % 7; const firstThursdayDate = 1 + firstThursdayOffset; const weekOfMonth = Math.floor((thursday.getDate() - firstThursdayDate) / 7) + 1; const fmtShort = (dt) => `${dt.getMonth() + 1}.${String(dt.getDate()).padStart(2, '0')}`; return { key: monStr, label: `${year}년 ${month}월 ${weekOfMonth}주차`, range: `${fmtShort(monday)}(월) ~ ${fmtShort(sunday)}(일)` }; } function calcLogVolume(log) { return log.exercises.reduce((acc, ex) => acc + ex.sets.reduce((sAcc, s) => sAcc + ((parseFloat(s.weight) || 0) * (parseFloat(s.reps) || 0)), 0), 0 ); } function renderWeeklyVolume() { const summaryEl = document.getElementById('weeklySummary'); const listEl = document.getElementById('weeklyList'); const countEl = document.getElementById('weeklyCount'); if (!appData.logs || appData.logs.length === 0) { countEl.textContent = '0주'; summaryEl.innerHTML = ''; listEl.innerHTML = `<div class="card" style="text-align:center; color:var(--text-muted); padding:30px;">저장된 운동 일지가 쌓이면 부위별 주간 유효 세트가 자동으로 집계됩니다.</div>`; return; } const weekMap = {}; appData.logs.forEach(log => { if (!log.date) return; const info = getWeekInfo(log.date); if (!weekMap[info.key]) { const muscleSets = {}; const muscleKg = {}; MUSCLE_GROUPS.forEach(m => { muscleSets[m] = 0; muscleKg[m] = 0; }); weekMap[info.key] = { key: info.key, label: info.label, range: info.range, totalSets: 0, sessions: 0, muscleSets, muscleKg }; } weekMap[info.key].sessions += 1; (log.exercises || []).forEach(ex => { const m = MUSCLE_GROUPS.includes(ex.muscle) ? ex.muscle : inferMuscle(ex.name); const sCount = (ex.sets || []).length; const kgVol = (ex.sets || []).reduce((acc, s) => acc + ((parseFloat(s.weight) || 0) * (parseFloat(s.reps) || 0)), 0); weekMap[info.key].totalSets += sCount; weekMap[info.key].muscleSets[m] = (weekMap[info.key].muscleSets[m] || 0) + sCount; weekMap[info.key].muscleKg[m] = (weekMap[info.key].muscleKg[m] || 0) + kgVol; }); }); const weeks = Object.values(weekMap).sort((a, b) => b.key.localeCompare(a.key)); countEl.textContent = `${weeks.length}주`; const latestWeek = weeks[0]; const prevWeek = weeks[1] || null; const avgSets = Math.round(weeks.reduce((sum, w) => sum + w.totalSets, 0) / weeks.length); const maxSets = Math.max(...weeks.map(w => w.totalSets), 1); let diffHtml = `<span class="diff-neutral">비교할 직전 주 없음</span>`; if (prevWeek && prevWeek.totalSets > 0) { const diff = latestWeek.totalSets - prevWeek.totalSets; const pct = ((diff / prevWeek.totalSets) * 100).toFixed(1); if (diff > 0) { diffHtml = `<span class="diff-up">▲ +${diff}세트 (+${pct}%)</span>`; } else if (diff < 0) { diffHtml = `<span class="diff-down">▼ ${diff}세트 (${pct}%)</span>`; } else { diffHtml = `<span class="diff-neutral">전주와 동일 (0%)</span>`; } } summaryEl.innerHTML = ` <div class="stat-box"> <div class="stat-label">최근 주간 유효 세트</div> <div class="stat-value" style="color:var(--primary);">${latestWeek.totalSets} 세트</div> <div class="stat-sub">${diffHtml}</div> </div> <div class="stat-box"> <div class="stat-label">주간 평균 세트</div> <div class="stat-value">${avgSets} 세트</div> <div class="stat-sub diff-neutral">최고 ${maxSets} 세트</div> </div> `; listEl.innerHTML = weeks.map(w => { const maxMuscleSet = Math.max(...MUSCLE_GROUPS.map(m => w.muscleSets[m] || 0), 1); const rowsHtml = MUSCLE_GROUPS.map(m => { const sVal = w.muscleSets[m] || 0; const kgVal = w.muscleKg[m] || 0; const pct = Math.round((sVal / maxMuscleSet) * 100); return ` <div class="muscle-row"> <div class="muscle-row-top"> <span class="muscle-name">${escapeHtml(m)}</span> <span> <span class="muscle-sets-text">${sVal}세트</span> <span class="muscle-kg-sub">(${kgVal.toLocaleString()}kg)</span> </span> </div> <div class="bar-track"> <div class="bar-fill" style="width:${pct}%;"></div> </div> </div> `; }).join(''); return ` <div class="week-card"> <div class="week-header"> <div> <div class="week-title">${escapeHtml(w.label)}</div> <div class="week-range">${escapeHtml(w.range)} · 운동 ${w.sessions}회</div> </div> <div class="week-sets-big">총 ${w.totalSets} 세트</div> </div> ${rowsHtml} </div> `; }).join(''); } function renderHistory() { const list = document.getElementById('historyList'); document.getElementById('historyCount').textContent = `${appData.logs.length}건`; if (appData.logs.length === 0) { list.innerHTML = `<div class="card" style="text-align:center; color:var(--text-muted); padding:30px;">아직 저장된 운동 기록이 없습니다.</div>`; return; } const sorted = [...appData.logs].reverse(); list.innerHTML = sorted.map(log => { const totalVol = calcLogVolume(log); const totalSets = (log.exercises || []).reduce((acc, ex) => acc + (ex.sets || []).length, 0); return ` <div class="history-item"> <div class="history-top"> <div> <strong style="font-size:15px;">${escapeHtml(log.date)} · ${escapeHtml(log.routineName)}</strong> <div style="font-size:11px; color:var(--text-muted);">${escapeHtml(log.programName)}</div> </div> <button class="btn btn-danger-outline" onclick="deleteLog('${log.id}')">삭제</button> </div> <div style="font-size:12px; color:var(--primary); font-weight:700; margin-bottom:8px;"> 총 ${totalSets}세트 · 볼륨 ${totalVol.toLocaleString()} kg </div> ${log.exercises.map(ex => { const m = ex.muscle || inferMuscle(ex.name); return ` <div style="font-size:12px; margin-bottom:6px; color:var(--text);"> <span class="muscle-mini-tag">${escapeHtml(m)}</span> <span style="font-weight:700;">${escapeHtml(ex.name)}:</span> <span style="color:var(--text-muted);"> ${ex.sets.map(s => `${s.weight}kg×${s.reps}`).join(' / ')} </span> ${ex.memo && ex.memo.trim() ? `<span class="history-memo">📌 ${escapeHtml(ex.memo.trim())}</span>` : ''} </div> `; }).join('')} </div> `; }).join(''); } function deleteLog(logId) { appData.logs = appData.logs.filter(l => l.id !== logId); saveStorage(); renderHistory(); showToast('기록이 삭제되었습니다'); } function openNewProgramModal() { document.getElementById('newProgName').value = ''; document.getElementById('newProgRoutines').value = ''; document.getElementById('newProgModal').classList.add('open'); } function confirmNewProgram() { const name = document.getElementById('newProgName').value.trim(); const rText = document.getElementById('newProgRoutines').value.trim(); if (!name || !rText) return; const rNames = rText.split(',').map(s => s.trim()).filter(Boolean); const newProg = { id: 'prog_' + Date.now(), name, routines: rNames.map((rn, idx) => ({ id: 'r_' + Date.now() + '_' + idx, day: `루틴 ${idx + 1}`, name: rn, desc: '사용자 정의 루틴', exercises: [ { name: '기본 종목 1', muscle: '가슴', sets: 3 } ] })) }; appData.programs.push(newProg); appData.activeProgramId = newProg.id; selectedRoutineId = newProg.routines[0].id; saveStorage(); closeModal('newProgModal'); renderPrograms(); showToast('새 분할 프로그램이 생성되었습니다'); } function closeModal(id) { document.getElementById(id).classList.remove('open'); } function switchView(viewName, btn) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById('view-' + viewName).classList.add('active'); document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); btn.classList.add('active'); if (viewName === 'weekly') renderWeeklyVolume(); if (viewName === 'history') renderHistory(); } function exportBackup() { const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `HitTheIron_Backup_${getLocalDateStr()}.json`; a.click(); URL.revokeObjectURL(url); showToast('백업 파일이 다운로드되었습니다'); } function importBackup(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { try { const parsed = JSON.parse(e.target.result); if (parsed.programs && parsed.logs) { appData = parsed; saveStorage(); renderPrograms(); showToast('백업 데이터를 성공적으로 복원했습니다'); } else { showToast('올바른 백업 파일이 아닙니다'); } } catch { showToast('파일을 읽는 중 오류가 발생했습니다'); } }; reader.readAsText(file); } function resetToDefault() { appData = JSON.parse(JSON.stringify(DEFAULT_DATA)); selectedRoutineId = null; currentSession = null; saveStorage(); renderPrograms(); document.getElementById('activeWorkoutHeader').style.display = 'none'; document.getElementById('workoutBottomActions').style.display = 'none'; renderSession(); showToast('기본 2분할 루틴으로 초기화되었습니다'); } init(); </script> </body> </html>
